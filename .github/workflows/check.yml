# Runs on every pull request (and on main): the same type-check and build Amplify runs, plus lint
# and the unit tests. A red check means: do not merge, the live app would get the problem.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same as amplify.yml: `npm ci` rejects this lockfile (bundled deps in @aws-amplify/data-construct).
      - run: npm install --no-audit --no-fund
      # The real file is written by Amplify during deploy; the app only needs its shape to compile.
      - name: Placeholder amplify_outputs.json
        run: |
          cat > amplify_outputs.json <<'JSON'
          {"version":"1.4","auth":{"aws_region":"eu-central-1","user_pool_id":"eu-central-1_ci","user_pool_client_id":"ci","identity_pool_id":"eu-central-1:00000000-0000-0000-0000-000000000000"},"data":{"url":"https://ci.invalid/graphql","aws_region":"eu-central-1","default_authorization_type":"AMAZON_COGNITO_USER_POOLS","authorization_types":[],"model_introspection":{"version":1,"models":{},"enums":{},"nonModels":{}}},"storage":{"aws_region":"eu-central-1","bucket_name":"ci"}}
          JSON
      - name: Type-check the app and tests
        run: npx tsc -b
      - name: Type-check the backend
        run: npx tsc --noEmit -p amplify
      - name: Lint
        run: npx oxlint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
