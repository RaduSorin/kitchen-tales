# Native iOS app (ios/): generates the Xcode project, builds it, runs the unit tests on an iPhone
# simulator. Nothing else: no screenshots and no uploads, so the run is as short as it can be.
# Visual checks are done by hand on an iPhone; the on-demand XCUITest walk is in ios-qa.yml.
# Runs when something under ios/ (or this file) changes: on every push to a claude/** branch, so
# a Claude thread sees the result before it opens or announces a pull request, and on pull
# requests from any other branch. macOS minutes cost 10x Linux ones, so a claude/** branch is not
# built a second time for its pull request: the push run's result shows on the PR anyway.
name: iOS

on:
  push:
    # main too, so its build cache is there for every new claude/** branch to start from.
    branches: ['claude/**', main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, about 15 seconds: duplicate type or file names in a target and app-extension files
  # that use app-only types (ios/scripts/precheck.py). These broke the macOS build most often, so
  # they are caught here before a macOS runner is started.
  precheck:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
      - run: python3 ios/scripts/precheck.py

  build-and-test:
    needs: precheck
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      # Full history for the file dates below, but without file contents (blob:none): only this
      # commit's files are downloaded, not every old version or the PNGs on other branches.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # Picking and booting the simulator takes about 30 seconds (CoreSimulator starts up), so it
      # runs in the background while the next steps prepare the build.
      - name: Start the simulator in the background
        run: |
          ( UDID=$(bash scripts/pick-simulator.sh) && echo "$UDID" > "$RUNNER_TEMP/sim-udid" \
            && xcrun simctl boot "$UDID"; touch "$RUNNER_TEMP/sim-done" ) > "$RUNNER_TEMP/sim.log" 2>&1 &

      # The build cache: Xcode only recompiles what changed since the last run on this branch (or
      # on main). A checkout gives every file today's date, which would look like a change to all
      # of them, so the dates are set back to each file's last commit first. --no-renames keeps
      # git from downloading old file contents to detect renames.
      - name: Keep file dates from git
        working-directory: .
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["git", "log", "--no-renames", "--name-only", "--format=@%ct", "--", "ios"], capture_output=True, text=True, check=True).stdout
          seen, when = set(), 0
          for line in out.splitlines():
              if line.startswith("@"): when = int(line[1:]); continue
              if line and line not in seen and os.path.exists(line):
                  seen.add(line); os.utime(line, (when, when))
          print(f"dates set on {len(seen)} files")
          PY

      # The key includes this file, so a change to the build flags saves a fresh cache.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData
          key: ios-dd-${{ runner.os }}-${{ hashFiles('ios/**/*.swift', 'ios/project.yml', '.github/workflows/ios.yml') }}
          restore-keys: ios-dd-${{ runner.os }}-

      # XcodeGen's prebuilt release instead of Homebrew: brew took up to a minute here (it pours
      # while the simulator boots), the download takes a few seconds.
      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/before-generate"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          # XcodeGen writes the project, plists and schemes anew every run. With today's date they
          # look changed and Xcode redoes the steps that read them, so they get project.yml's
          # date: same project.yml, same files.
          find . -path ./build -prune -o -type f -newer "$RUNNER_TEMP/before-generate" -print \
            | tee "$RUNNER_TEMP/generated.txt" | xargs -I{} touch -r project.yml {}
          echo "generated files dated like project.yml: $(wc -l < "$RUNNER_TEMP/generated.txt")"
          # Folders get a fixed old date too: a checkout dates them today, and Xcode reads a folder
          # like Assets.xcassets as one input, so the asset catalog was compiled again every run.
          find . -path ./build -prune -o -type d -print | xargs -I{} touch -t 202001010000 {}

      # Built for "any simulator" so the build does not wait for the simulator, which is still
      # booting in the background; arm64 only, like the runner.
      - name: Build the app and the unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project KitchenTales.xcodeproj -scheme KitchenTales \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*\.swift|\*\* (TEST |)BUILD" || true
          # What the build did (a warm run compiles only the changed files) and where the time went.
          grep -oE "^[A-Z][A-Za-z]+ " build/xcodebuild.log | sort | uniq -c | sort -rn | head -12
          sed -n "/Build Timing Summary/,/^\*\*/p" build/xcodebuild.log | head -25
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/xcodebuild.log

      - name: Run the unit tests
        run: |
          for i in $(seq 180); do [ -f "$RUNNER_TEMP/sim-done" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/sim.log"
          UDID=$(cat "$RUNNER_TEMP/sim-udid")
          set -o pipefail
          xcodebuild test-without-building \
            -project KitchenTales.xcodeproj -scheme KitchenTales \
            -destination "id=$UDID,arch=arm64" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            | tee build/test.log | grep -E "error:|Test (Case|Suite|run)|✔|✘|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/test.log
