# Native iOS app (ios/): generates the Xcode project, builds it, runs the unit tests on an iPhone
# simulator. A run started by hand also saves screenshots of the main screens.
# Runs when something under ios/ (or this file) changes: on every push to a claude/** branch, so
# a Claude thread sees the result before it opens or announces a pull request, and on pull
# requests from any other branch. macOS minutes cost 10x Linux ones, so a claude/** branch is not
# built a second time for its pull request: the push run's result shows on the PR anyway.
name: iOS

on:
  push:
    # main too, so its build cache is there for every new claude/** branch to start from.
    branches: ['claude/**', main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, about 15 seconds: duplicate type or file names in a target and app-extension files
  # that use app-only types (ios/scripts/precheck.py). These broke the macOS build most often, so
  # they are caught here before a macOS runner is started.
  precheck:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
      - run: python3 ios/scripts/precheck.py

  build-and-test:
    needs: precheck
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write   # only to publish the screenshots to the ios-screenshots branch
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # for the file dates below

      # The build cache: Xcode only recompiles what changed since the last run on this branch (or
      # on main). A checkout gives every file today's date, which would look like a change to all
      # of them, so the dates are set back to each file's last commit first.
      - name: Keep file dates from git
        working-directory: .
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["git", "log", "--name-only", "--format=@%ct", "--", "ios"], capture_output=True, text=True).stdout
          seen, when = set(), 0
          for line in out.splitlines():
              if line.startswith("@"): when = int(line[1:]); continue
              if line and line not in seen and os.path.exists(line):
                  seen.add(line); os.utime(line, (when, when))
          print(f"dates set on {len(seen)} files")
          PY

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData
          key: ios-dd-${{ runner.os }}-${{ hashFiles('ios/**/*.swift', 'ios/project.yml') }}
          restore-keys: ios-dd-${{ runner.os }}-

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(bash scripts/pick-simulator.sh)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot it now, so the boot overlaps the build instead of following it.
          xcrun simctl boot "$UDID" || true

      - name: Build and run the unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project KitchenTales.xcodeproj -scheme KitchenTales \
            -destination "id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*\.swift|Test (Case|Suite|run)|✔|✘|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log

      # Screenshots take about 10 minutes, so only a run started by hand makes them
      # (Actions > iOS > Run workflow).
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'KitchenTales.app' | head -1)
          bash scripts/screenshots.sh "$APP" "${{ steps.sim.outputs.udid }}"

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore

      # Also commit them to the ios-screenshots branch (folder pr-<number>, or the branch name for
      # a push run or a run started by hand), so they can be viewed on GitHub and compared before/after
      # without downloading the artifact.
      - name: Publish screenshots to the ios-screenshots branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # pr-<number>, or the branch name for a push run or a run started by hand.
          DEST: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SRC="$PWD/build/screenshots"
          cd "$RUNNER_TEMP" && git init -q shots && cd shots
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin ios-screenshots; then git checkout -q FETCH_HEAD; fi
          git checkout -q -B ios-screenshots
          rm -rf "$DEST" && mkdir -p "$DEST" && cp "$SRC"/*.png "$DEST"/
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots for $DEST at $HEAD_SHA"
          git push -q origin ios-screenshots
          echo "Screenshots: https://github.com/${{ github.repository }}/tree/ios-screenshots/$DEST"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-log
          path: |
            ios/build/xcodebuild.log
            ios/build/Tests.xcresult

  # Tells whether the App Store Connect secrets needed for TestFlight are set (never their values).
  # The TestFlight upload itself comes in the next PR.
  testflight-readiness:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the App Store Connect secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: missing"; fi
          done
          if [ -n "$ASC_KEY_P8" ] && ! printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::warning::ASC_KEY_P8 is set but does not look like the contents of a .p8 file"
          fi
