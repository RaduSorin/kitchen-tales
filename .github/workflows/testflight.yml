# Builds the native iOS app for the App Store, signs it and uploads it to TestFlight.
# Runs when a change to ios/ reaches main, or by hand (Actions › TestFlight › Run workflow).
#
# Signing is automatic ("cloud-managed"): Xcode uses the App Store Connect API key to create or
# fetch the distribution certificate and provisioning profile itself, so no certificates are kept
# in the repo. Needs these repository secrets (Settings › Secrets and variables › Actions):
#   ASC_KEY_ID      the key's ID (App Store Connect › Users and Access › Integrations)
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the whole contents of the downloaded AuthKey_<id>.p8 file
#   APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com › Membership details)
# The key needs the Admin role: cloud-managed distribution certificates are not available to
# App Manager keys.
name: TestFlight

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/testflight.yml']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        working-directory: .
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight upload skipped, missing secrets:$missing"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
        if: env.SKIP != '1'

      - name: Use the newest Xcode on the runner
        if: env.SKIP != '1'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen and generate the project
        if: env.SKIP != '1'
        run: brew install xcodegen && xcodegen generate

      - name: Write the API key
        if: env.SKIP != '1'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          mkdir -p build
          # Build numbers only go up: this workflow's run number, offset past any earlier uploads.
          BUILD=$(( 100 + ${{ github.run_number }} ))
          echo "Build number $BUILD"
          xcodebuild archive \
            -project KitchenTales.xcodeproj -scheme KitchenTales \
            -destination "generic/platform=iOS" \
            -archivePath build/KitchenTales.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | tee build/archive.log | grep -E "error:|warning: .*\.swift|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      - name: Sign and upload to TestFlight
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/KitchenTales.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build/export.log
          echo "Uploaded. The build shows up in TestFlight after Apple processes it (usually 5 to 15 minutes)."

      - name: Remove the API key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testflight-logs
          path: |
            ios/build/archive.log
            ios/build/export.log
