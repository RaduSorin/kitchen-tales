version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node -v && npm -v
    build:
      commands:
        # `npm ci` rejects this lockfile because of npm's handling of bundled
        # dependencies inside @aws-amplify/data-construct; `npm install`
        # resolves the same tree from package-lock.json.
        - npm install --no-audit --no-fund --cache .npm --prefer-offline
        # A merge that only touches the native iOS app (ios/) skips the backend deploy and only
        # fetches the existing outputs; the web bundle then builds unchanged, so the installed
        # web app sees no new version. If git cannot tell (shallow clone), it deploys as usual.
        - |
          if git diff --quiet HEAD^1 HEAD -- . ':(exclude)ios' 2>/dev/null; then
            echo "Only ios/ changed: skipping the backend deploy"
            npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
          else
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
          fi
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
