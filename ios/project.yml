# XcodeGen spec for the native iOS app. The .xcodeproj is generated from this file (in CI and on
# any Mac with `xcodegen generate`) and is not committed. See ios/README.md.
name: KitchenTales
options:
  bundleIdPrefix: app.kitchentales
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ro
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # CI sets the build number from the workflow run (CURRENT_PROJECT_VERSION=<run number>).
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  KitchenTales:
    type: application
    platform: iOS
    sources:
      - path: KitchenTales
        excludes:
          - KitchenTales.entitlements
    dependencies:
      # "Salvează în Bucătăria" in the Share sheet.
      - target: KitchenTalesShare
    entitlements:
      path: KitchenTales/KitchenTales.entitlements
      properties:
        # The sign-in is shared with the Share extension through this Keychain group.
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.kitchentales.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kitchentales.ios
        PRODUCT_NAME: KitchenTales
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KitchenTales/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: KitchenTales/Info.plist
      properties:
        CFBundleDisplayName: Bucătăria
        CFBundleDevelopmentRegion: ro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # kitchentales://recipe/<id>: the Share card's "Deschide rețeta".
        CFBundleURLTypes:
          - CFBundleURLName: app.kitchentales.ios
            CFBundleURLSchemes:
              - kitchentales
        ITSAppUsesNonExemptEncryption: false
        # The app is always dark ("Seară de lux"), like the web app.
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: Ca să înregistrezi povești citite cu vocea ta și să dictezi rețete.
        NSSpeechRecognitionUsageDescription: Ca să dictezi rețete, ingrediente și pași.
        NSCameraUsageDescription: Ca să fotografiezi o rețetă din carte sau poza unui fel de mâncare.
        # Stories keep playing with the screen off and show on the Lock Screen.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fraunces-400.ttf
          - Fraunces-600.ttf
          - Fraunces-600-Italic.ttf
          - Figtree-400.ttf
          - Figtree-600.ttf
          - Figtree-700.ttf
          - Figtree-800.ttf
          - Baloo2-400.ttf
          - Baloo2-600.ttf
          - Baloo2-800.ttf
          - YoungSerif-400.ttf
          - Caveat-700.ttf
  # The Share extension: imports a recipe from a link, text or photo shared from another app.
  # It reuses the sign-in, backend and design files of the app and the shared Features/ShareIn.
  KitchenTalesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Share.entitlements
      - path: KitchenTales/Features/ShareIn
        excludes:
          - ShareInApp.swift
      - path: KitchenTales/Auth/Account.swift
      - path: KitchenTales/Auth/CognitoClient.swift
      - path: KitchenTales/Auth/CognitoSRP.swift
      - path: KitchenTales/Auth/BigUInt.swift
      - path: KitchenTales/Data/Backend.swift
      - path: KitchenTales/Design/Theme.swift
      - path: KitchenTales/Design/AppFont.swift
      - path: KitchenTales/Resources/AuthConfig.json
        buildPhase: resources
      - path: KitchenTales/Resources/Fonts/Figtree-400.ttf
        buildPhase: resources
      - path: KitchenTales/Resources/Fonts/Figtree-600.ttf
        buildPhase: resources
      - path: KitchenTales/Resources/Fonts/Figtree-700.ttf
        buildPhase: resources
      - path: KitchenTales/Resources/Fonts/YoungSerif-400.ttf
        buildPhase: resources
      - path: KitchenTales/Resources/Fonts/Fraunces-400.ttf
        buildPhase: resources
    entitlements:
      path: ShareExtension/Share.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.kitchentales.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kitchentales.ios.share
        PRODUCT_NAME: KitchenTalesShare
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Bucătăria
        CFBundleDevelopmentRegion: ro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Figtree-400.ttf
          - Figtree-600.ttf
          - Figtree-700.ttf
          - YoungSerif-400.ttf
          - Fraunces-400.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
  KitchenTalesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KitchenTalesTests
    dependencies:
      - target: KitchenTales
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kitchentales.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  # QA flows (XCUITest): drive the app in the simulator like a tester, with the -demo account.
  # Not part of the KitchenTales scheme, so the normal CI run does not build or run them; they
  # run in .github/workflows/ios-qa.yml through the KitchenTalesQA scheme.
  KitchenTalesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KitchenTalesUITests
    dependencies:
      - target: KitchenTales
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kitchentales.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KitchenTales
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  KitchenTales:
    build:
      targets:
        KitchenTales: all
        KitchenTalesTests: [test]
    test:
      targets:
        - KitchenTalesTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
  KitchenTalesQA:
    build:
      targets:
        KitchenTales: all
        KitchenTalesUITests: [test]
    test:
      config: Debug
      targets:
        - KitchenTalesUITests
      gatherCoverageData: false
